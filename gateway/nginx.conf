# Real client IP: Traefik (Coolify) sits in front on a private Docker network.
# Without this, every request appears to come from Traefik and per-IP limits break.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Tier by hostname: PUBLIC_DOMAIN hosts are "public" (no key, capped),
# everything else is "vib" (API key). tier.map is generated by entrypoint.sh.
map $host $tier {
    include /etc/nginx/tier.map;
}

# Extract API key from URL: /http/KEY or /ws/KEY
map $uri $api_key {
    ~^/http/(?<k>[a-zA-Z0-9]+)  $k;
    ~^/ws/(?<k>[a-zA-Z0-9]+)    $k;
    default                      "";
}

# Validate key against the generated keys.map file
# keys.map contains lines like: "abc123" 1;
# If no keys are configured, it contains: default 1;
map $api_key $key_valid {
    include /etc/nginx/keys.map;
}

# Rate-limit keys. An empty key means "not counted", so each zone only
# applies to its own tier.
map $tier $public_ip  { public $binary_remote_addr; default ""; }
map $tier $public_all { public "public";            default ""; }
map $tier $vib_key    { public "";                  default $api_key; }

# Public tier: per-IP and whole-tier caps. The whole-tier caps are what
# protect VIB: however many public users show up, together they never
# exceed these numbers. Tune them from stress-test results.
limit_req_zone  $public_ip  zone=public_ip:20m  rate=25r/s;
limit_req_zone  $public_all zone=public_all:1m  rate=400r/s;
limit_conn_zone $public_ip  zone=public_conn:20m;

# VIB tier: generous per-key abuse guard only.
limit_req_zone  $vib_key    zone=vib_key:10m    rate=200r/s;

limit_req_status  429;
limit_conn_status 429;

# Max concurrent public calls inside Nitro; extra requests fail fast with 503.
upstream nitro_http_public {
    zone nitro_http_public 64k;
    server nitro:8545 max_conns=48;
}

# Max concurrent public WebSocket connections.
upstream nitro_ws_public {
    zone nitro_ws_public 64k;
    server nitro:8546 max_conns=500;
}

js_path /etc/nginx/njs;
js_import rpc from rpc-filter.js;

# Log format with API key for stats
log_format rpc '$time_iso8601 key=$api_key tier=$tier ip=$remote_addr method=$request_method uri=$uri status=$status time=$request_time';

server {
    listen 80;
    server_name _;

    # RPC request log (for stats)
    access_log /data/rpc.log rpc;

    # Public tier: no API key, route to the capped internal locations.
    if ($tier = public) {
        rewrite ^/http(/[a-zA-Z0-9]+)?$ /_public/http last;
        rewrite ^/ws(/[a-zA-Z0-9]+)?$   /_public/ws   last;
    }

    # Dashboard - always public
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        access_log off;
    }

    # Status API - always public
    location /api/status {
        proxy_pass http://init:9000/api/status;
        proxy_set_header Host $host;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store";
        add_header Access-Control-Allow-Origin *;
        access_log off;
    }

    # CORS preflight for RPC endpoints
    location ~ ^/http(/[a-zA-Z0-9]+)?$ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin '*';
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'Content-Type';
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }

        if ($key_valid = 0) {
            add_header Access-Control-Allow-Origin '*' always;
            return 401 '{"error":"Invalid or missing API key"}';
        }

        limit_req zone=vib_key burst=400 nodelay;

        rewrite ^/http(/[a-zA-Z0-9]+)?$ / break;
        proxy_pass http://nitro:8545;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        client_max_body_size 10m;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin '*' always;
    }

    # WebSocket endpoint: /ws or /ws/KEY
    location ~ ^/ws(/[a-zA-Z0-9]+)?$ {
        if ($key_valid = 0) {
            add_header Access-Control-Allow-Origin '*' always;
            return 401 '{"error":"Invalid or missing API key"}';
        }

        rewrite ^/ws(/[a-zA-Z0-9]+)?$ / break;
        proxy_pass http://nitro:8546;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # ---- Public tier (internal, reached only via the rewrite above) ----

    location = /_public/http {
        internal;
        access_log off;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin '*';
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'Content-Type';
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }

        limit_req  zone=public_ip  burst=50  nodelay;
        limit_req  zone=public_all burst=200 nodelay;
        limit_conn public_conn 20;
        error_page 429 = @public_rate_limited;

        # Body must stay in memory for the njs filter to read it.
        client_max_body_size    256k;
        client_body_buffer_size 256k;

        add_header Access-Control-Allow-Origin '*' always;
        js_content rpc.filter;
    }

    location @public_http_proxy {
        access_log off;
        # Nitro only serves JSON-RPC on "/"
        rewrite ^ / break;
        proxy_pass http://nitro_http_public;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
        proxy_next_upstream off;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin '*' always;
        error_page 502 504 = @public_busy;
    }

    location = /_public/ws {
        internal;
        access_log off;

        limit_req  zone=public_ip  burst=50  nodelay;
        limit_conn public_conn 5;
        error_page 429 = @public_rate_limited;

        rewrite ^ / break;
        proxy_pass http://nitro_ws_public;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
        proxy_next_upstream off;
        error_page 502 504 = @public_busy;
    }

    location @public_rate_limited {
        default_type application/json;
        add_header Access-Control-Allow-Origin '*' always;
        add_header Retry-After 1 always;
        return 429 '{"jsonrpc":"2.0","id":null,"error":{"code":-32005,"message":"Rate limit exceeded on the public RPC. Request a VIB key for higher limits."}}';
    }

    location @public_busy {
        default_type application/json;
        add_header Access-Control-Allow-Origin '*' always;
        add_header Retry-After 2 always;
        return 503 '{"jsonrpc":"2.0","id":null,"error":{"code":-32005,"message":"Public RPC is at capacity, retry shortly. Request a VIB key for reserved capacity."}}';
    }
}
